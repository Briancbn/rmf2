networks:
  rmf2-network:

services:
  mosquitto:
    image: eclipse-mosquitto:2
    volumes:
      - mosquitto-broker-data:/mosquitto/data
      - mosquitto-broker-log:/mosquitto/log
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
    ports:
      - "1883:1883"

volumes:
  mosquitto-broker-data:
  mosquitto-broker-log:
