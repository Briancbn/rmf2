include:
  - ./infra/docker-compose.yml

services:
  rmf2-vda5050-master:
    build:
      context: ./services/rmf2_vda5050_master
      dockerfile: Dockerfile
    develop:
      watch:
        - action: sync
          path: ./services/rmf2_vda5050_master/src
          target: /app/src
          ignore:
            - __pycache__/
        - action: rebuild
          path: ./services/rmf2_vda5050_master/pyproject.toml
        - action: rebuild
          path: ./services/rmf2_vda5050_master/uv.lock
    depends_on:
      mqtt-broker:
        condition: service_healthy
      amqp-broker:
        condition: service_healthy
    networks:
      - rmf2-net
    volumes:
      - ./demos/warehouse/warehouse.lif.json:/app/data/warehouse.lif.json:ro
      - ./demos/warehouse/agv_config.toml:/app/config.toml:ro
    environment:
      MODE: dev
      RMF2_VM__MQTT_BROKER: "tcp://mqtt-broker:${MQTT_PORT:-1883}"
      RMF2_VM__TRANSPORT: amqp
      RMF2_VM__AMQP__URL: "amqp://guest:guest@amqp-broker/"
      RMF2_VM__AMQP__EXCHANGE: rmf2
      RMF2_VM__MASTER_MQTT_CLIENT_ID: "example-master"
      RMF2_VM__HOST: "0.0.0.0"
      RMF2_VM__PORT: "8000"
      RMF2_VM__ROOT_PATH: "/vda5050_master"
      RMF2_VM__MAP_PATH: "data/warehouse.lif.json"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rmf2-vm.rule=PathPrefix(`/vda5050_master`)"
      - "traefik.http.routers.rmf2-vm.entrypoints=web"
      - "traefik.http.middlewares.rmf2-vm-strip.stripprefix.prefixes=/vda5050_master"
      - "traefik.http.routers.rmf2-vm.middlewares=rmf2-vm-strip"
      - "traefik.http.services.rmf2-vm.loadbalancer.server.port=8000"

  rmf2-plan-server:
    build:
      context: ./services/rmf2_res
      dockerfile: Dockerfile
    develop:
      watch:
        - action: sync
          path: ./services/rmf2_res/src
          target: /app/src
          ignore:
            - __pycache__/
        - action: rebuild
          path: ./services/rmf2_res/pyproject.toml
        - action: rebuild
          path: ./services/rmf2_res/uv.lock
    depends_on:
      amqp-broker:
        condition: service_healthy
    networks:
      - rmf2-net
    environment:
      MODE: dev
      RMF2_PS__HOST: "0.0.0.0"
      RMF2_PS__PORT: "8000"
      RMF2_PS__ROOT_PATH: "/plan_server"
      RMF2_PS__TRANSPORT: amqp
      RMF2_PS__AMQP__URL: "amqp://guest:guest@amqp-broker/"
      RMF2_PS__AMQP__EXCHANGE: rmf2
      RMF2_PS__MAP_PATH: "data/basic_grid.lif.json"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rmf2-ps.rule=PathPrefix(`/plan_server`)"
      - "traefik.http.routers.rmf2-ps.entrypoints=web"
      - "traefik.http.middlewares.rmf2-ps-strip.stripprefix.prefixes=/plan_server"
      - "traefik.http.routers.rmf2-ps.middlewares=rmf2-ps-strip"
      - "traefik.http.services.rmf2-ps.loadbalancer.server.port=8000"

