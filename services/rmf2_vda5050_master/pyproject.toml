[project]
name = "rmf2-vda5050-master"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Chen Bainian", email = "chenbn@a-star.edu.sg" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    "vda5050-core>=0.1.0rc3",
]

[project.scripts]
rmf2_vda5050_master = "rmf2_vda5050_master.cli:main"

[tool.uv_build]
include = ["src/rmf2_vda5050_master/schemas/*.json"]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
vda5050-core = { path = "../vda5050_core/vda5050_core" }
