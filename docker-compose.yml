name: rmf2

services:
  mqtt-broker:
    image: eclipse-mosquitto:2
    volumes:
      - ./infra/mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "${MQTT_PORT:-1883}:${MQTT_PORT:-1883}"
    networks:
      - rmf2-net
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -p ${MQTT_PORT:-1883} -t healthcheck -m ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5s

  amqp-broker:
    image: rabbitmq:3-management
    ports:
      - "${AMQP_PORT:-5672}:${AMQP_PORT:-5672}"
      - "${AMQP_MGMT_PORT:-15672}:${AMQP_MGMT_PORT:-15672}"
    networks:
      - rmf2-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  rmf2-net:
    driver: bridge
    name: rmf2-net
